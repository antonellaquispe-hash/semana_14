spring:
  application:
    name: cliente-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: configserver:http://localhost:8888
resilience4j:
  circuitbreaker:
    instances:
      pedidoDesdeCliente:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
